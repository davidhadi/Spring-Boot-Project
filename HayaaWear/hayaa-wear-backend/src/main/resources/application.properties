spring.application.name=hayaa-wear-backend
server.port=8080

# DATABASE CONFIG

spring.datasource.url=jdbc:mysql://localhost:3306/hayaawear_db?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update

#spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# JACKSON
spring.jackson.serialization.fail-on-empty-beans=false

# JWT CONFIG
jwt.secret=jwt.secret=HAYAAWEAR_SUPER_SECRET_KEY_2026_SECURE_32_CHARS
jwt.expiration=86400000

# SWAGGER / OPENAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Enable Redis Cache
spring.cache.type=redis


